name: Lint

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly link check, Mondays 06:00 UTC, to catch dead or moved links.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  awesome-lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Run awesome-lint
        run: npx --yes awesome-lint

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,403,429
            --exclude-path .github
            README.md contributing.md
          fail: true
